name: Validate pkg-config exports

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact feature commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: pkg-config (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      USE_BAZEL_VERSION: 8.5.1
      TEST_REVISION: ${{ inputs.revision }}
      BASE_REVISION: 52bea033ef1eac6de5164efb6c1f9552cf59fb49
      EXPECTED_MACHINE: ${{ matrix.machine }}
      TEST_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: securely1g/rules_distroless
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.29.0
      - name: Verify source and native architecture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_REVISION"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/revision.txt
          uname -m > artifacts/machine.txt
          bazel --version | tee artifacts/bazel-version.txt
          test "$(cat artifacts/bazel-version.txt)" = 'bazel 8.5.1'
      - name: Reproduce missing exports on unchanged upstream
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/pkgconfig-baseline"
          git worktree add --detach "$baseline" "$BASE_REVISION"
          git show HEAD:MODULE.bazel > "$baseline/MODULE.bazel"
          git archive HEAD apt/tests/pkgconfig | tar -x -C "$baseline"
          set +e
          (cd "$baseline" && bazel --output_base="$RUNNER_TEMP/baseline-output" test \
            --jobs=4 --repository_cache="$RUNNER_TEMP/repository-cache" \
            --test_output=errors "//apt/tests/pkgconfig:transitive_${TEST_ARCH}_test") \
            > artifacts/baseline.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -E "target 'pkgconfig' not declared|no such target.*:pkgconfig" artifacts/baseline.log
      - name: Test patched imports and existing suites
        run: |
          set -euo pipefail
          bazel --output_base="$RUNNER_TEMP/patched-output" test \
            --jobs=4 --local_resources=cpu=4 --local_resources=memory=8000 \
            --repository_cache="$RUNNER_TEMP/repository-cache" \
            --test_output=errors --nocache_test_results \
            --build_event_json_file="$PWD/artifacts/test-events.jsonl" \
            //apt/tests:all //apt/tests/pkgconfig:all //distroless/tests:all \
            2>&1 | tee artifacts/test.log
      - name: Retain exact upstream dependency archive
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil
          digest = '8a70a79613fe3609651b288e7150cc4c7697d22db2d54c6ae535ee78fbf21b804e05e95773d064fd501913e21a9264f3823643135c3ea5dffc4f04aaedd09b5d'
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'repository-cache/content_addressable/sha512' / digest / 'file'
          if source.is_file():
              assert hashlib.sha512(source.read_bytes()).hexdigest() == digest
              dest = pathlib.Path('artifacts/dependencies/ape-1.1.0/src.tar.gz')
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, dest)
          PY
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pkgconfig-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
