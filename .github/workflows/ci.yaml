name: C++ template headers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-headers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        bazel-version: [7.x, 8.x]
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: bazel-contrib/setup-bazel@0.19.0
      - name: Test header classification
        run: USE_BAZEL_VERSION=${{ matrix.bazel-version }} bazel test //apt/tests:headers/supported_fragments //apt/tests:headers/exclude_non_include_paths //apt/tests:headers/exclude_other_suffixes
      - name: Build and test the imported Boost SDK
        run: USE_BAZEL_VERSION=${{ matrix.bazel-version }} bazel test //...
        working-directory: e2e/template_headers
      - name: Confirm regression fails without the importer fix
        if: matrix.bazel-version == '8.x'
        shell: bash
        working-directory: e2e/template_headers
        run: |
          cp ../../apt/private/deb_import.bzl "$RUNNER_TEMP/deb_import.fixed.bzl"
          trap 'cp "$RUNNER_TEMP/deb_import.fixed.bzl" ../../apt/private/deb_import.bzl' EXIT
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('../../apt/private/deb_import.bzl')
          original = path.read_text()
          fixed = 'elif line.endswith(".h") or is_include_fragment(line):'
          assert fixed in original
          path.write_text(original.replace(fixed, 'elif line.endswith(".h"):'))
          PYCODE
          set +e
          USE_BAZEL_VERSION=${{ matrix.bazel-version }} bazel test //:declared_headers_test --test_output=errors > "$RUNNER_TEMP/header-regression.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/header-regression.log"
          test "$status" -ne 0
          grep -F 'Missing declared Boost header: boost/xpressive/detail/utility/chset/basic_chset.ipp' "$RUNNER_TEMP/header-regression.log"
          grep -F 'Missing declared Boost header: boost/spirit/home/classic/utility/impl/chset/basic_chset.ipp' "$RUNNER_TEMP/header-regression.log"
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: template-header-logs-${{ matrix.bazel-version }}-${{ matrix.os }}
          path: |
            bazel-testlogs/**/test.log
            e2e/template_headers/bazel-testlogs/**/test.log
          if-no-files-found: ignore
          retention-days: 5
